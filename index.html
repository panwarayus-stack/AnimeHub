      // Prevent crashes from third-party or sandbox scripts trying to write to window.fetch
      try {
        const originalFetch = window.fetch;
        let currentFetch = originalFetch;
        Object.defineProperty(window, 'fetch', {
          get: () => currentFetch,
          set: (val) => { currentFetch = val; },
          configurable: true,
          enumerable: true
        });
      } catch (e) {
        // Safe fallback
      }
    </script>
